[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tontine-core"
version = "0.1.0"
description = "A transparent, auditable Python engine for community tontines"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "tontine-core contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.coverage.run]
source = ["tontine"]
